name: terraform

# Contrôles statiques à chaque PR, plan sur PR, apply sur main derrière une
# approbation manuelle (environnement GitHub « demo » avec reviewers requis).
# Authentification Azure : OIDC fédéré (aucun secret client stocké dans GitHub).
# Les identifiants ci-dessous (client/tenant/subscription id) ne sont pas des secrets :
# ils sont stockés en *variables* de dépôt.
# En production : épingler chaque action par SHA de commit.

on:
  pull_request:
    paths: ["infra/**", "policy_check/**", ".checkov.yaml", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**"]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.9.8"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_owner: ${{ vars.TF_OWNER }}
  TF_VAR_allowed_ingress_cidrs: ${{ vars.TF_ALLOWED_INGRESS_CIDRS }} # ex. ["203.0.113.10/32"]
  TF_VAR_budget_contact_emails: ${{ vars.TF_BUDGET_EMAILS }}         # ex. ["vous@example.com"]
  TF_VAR_container_image: ${{ vars.TF_CONTAINER_IMAGE }}

jobs:
  static:
    name: fmt · validate · tflint · checkov · trivy · policy_check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: |
          terraform init -backend=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          # call_module_type = "local" : les modules sont inspectés depuis la racine
          tflint --chdir=infra --config "$GITHUB_WORKSPACE/.tflint.hcl"

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          config_file: .checkov.yaml
          soft_fail: false

      - name: trivy (misconfig IaC)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: policy_check (règles maison)
        working-directory: .
        run: |
          python3 policy_check/check.py infra
          python3 -m unittest discover -s policy_check/tests -v

  plan:
    name: plan (PR)
    if: github.event_name == 'pull_request'
    needs: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # jeton OIDC pour Azure
      pull-requests: write  # commentaire du plan
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: init
        run: terraform init
      - name: plan
        id: plan
        run: terraform plan -lock-timeout=5m -no-color -out=tfplan | tee plan.txt
      - name: commenter le plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan.txt', 'utf8');
            const summary = plan.split('\n').filter(l => /^Plan:|No changes/.test(l)).join('\n');
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `### terraform plan\n\`\`\`\n${summary || 'voir les logs'}\n\`\`\``
            });

  apply:
    name: apply (main, approbation manuelle)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: static
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init
      - run: terraform apply -lock-timeout=5m -auto-approve
